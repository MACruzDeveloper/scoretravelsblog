# Weekly pull requests with dependency updates
version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates in one PR per week
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
