# nginx in front of the Express app (port 3040). Replace midominio.com with the real domain.
# Install: see docs/deployment.md

server {
    listen 80;
    listen [::]:80;
    server_name midominio.com www.midominio.com;

    return 301 https://midominio.com$request_uri;
}

# Shared by both HTTPS blocks below
ssl_certificate /etc/letsencrypt/live/midominio.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/midominio.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

server {
    # nginx >= 1.25.1 prefers "listen 443 ssl;" plus "http2 on;"
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.midominio.com;

    return 301 https://midominio.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name midominio.com;

    # Image uploads accept up to 10 MB (server/routes/imagesRoute.js)
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/ttf font/otf;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Vite build output: file names carry a content hash, so they never change
    location /assets/ {
        proxy_pass http://127.0.0.1:3040;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Uploaded images (/static/images) and files from client/public
    location /static/ {
        proxy_pass http://127.0.0.1:3040;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # API: responses depend on the session, never cache them
    location /api/ {
        proxy_pass http://127.0.0.1:3040;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store";
    }

    # SPA routes and index.html: always revalidate so a deploy is picked up at once
    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache";
    }
}
