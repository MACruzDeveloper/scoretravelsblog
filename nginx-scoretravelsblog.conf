server {
    listen 80;
    server_name midominio.com www.midominio.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name midominio.com www.midominio.com;

    ssl_certificate /etc/letsencrypt/live/midominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/midominio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Enable gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Cache settings for static assets (fonts, images, JS, CSS)
    location ~* \.(woff|woff2|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(js|css)$ {
        expires 30d;
        add_header Cache-Control "public, must-revalidate, max-age=2592000";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif)$ {
        expires 90d;
        add_header Cache-Control "public, max-age=7776000";
        add_header Vary Accept;
        access_log off;
    }

    # Cache for API responses (shorter duration)
    location /admin/api/ {
        proxy_pass http://127.0.0.1:3040;
        proxy_cache_valid 200 5m;
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header Cache-Control "public, max-age=300";
    }

    # Google Fonts caching
    location ~ ^https://fonts\.(googleapis|gstatic)\.com {
        proxy_pass $scheme://$host$request_uri;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Main proxy for application
    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        # Add cache headers for HTML (no cache to ensure fresh content)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
